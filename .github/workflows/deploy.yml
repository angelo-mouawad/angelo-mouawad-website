name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the notes repo when notes change, so the site rebuilds with them
  repository_dispatch:
    types: [notes-updated]
  # Daily rebuild so the commit skyline on the home page stays current
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The notes live in their own repo and are read from content/notes at build time
      - uses: actions/checkout@v4
        with:
          repository: angelo-mouawad/angelo-mouawad-notes
          path: content/notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fresh contribution data for the skyline. If the service is down, the committed JSON is used instead.
      - run: npm run contributions
        continue-on-error: true

      - run: npm run build
        env:
          # Contact form key on /websites; add it under Settings > Secrets and variables > Actions
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
